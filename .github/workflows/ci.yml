name: CI

on:
  push:
    # TODO(release-wave): drop protocol-3.4 once it merges into main.
    branches: [main, protocol-3.4]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build every vcpkg port with the CMake (and ninja) that vcpkg pins for
  # this baseline, not whatever the runner image ships. The macOS image moved
  # to CMake 4.5.0, which rejects boost-locale 1.90 at configure time
  # (source_group: "include/boost/locale" is not a prefix of "locale.hpp").
  # Linux runners already used vcpkg's own CMake 4.2.3 because theirs was too
  # old; this makes that the rule on every runner.
  VCPKG_FORCE_DOWNLOADED_BINARIES: "1"
  # Use Cloudflare's S3-compatible R2 endpoint directly because vcpkg binary
  # archives can exceed the Worker request-size limit. Fork PRs do not receive
  # secrets, so disable the remote cache instead of issuing broken AWS calls.
  VCPKG_BINARY_SOURCES: "${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_KEY_ID != '' && secrets.R2_ENDPOINT != '' && 'clear;x-aws,s3://query-farm-duckdb-vcpkg/,readwrite' || 'clear' }}"
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  # Seconds, and it fails the run before anything is built: a formatting-only
  # diff arriving on top of a real change is what the formatter exists to stop.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install 'clang-format~=22.1'
      - name: Check formatting
        run: ./scripts/format.sh --check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
          - os: ubuntu-24.04-arm
            compiler: gcc
          - os: macos-latest
            compiler: apple-clang

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The SDK is built from source as a subdirectory, not from an installed
      # copy: the two move together, and an installed one goes stale silently.
      # CMakeLists.txt looks for it beside this repo by default.
      #
      # Pinned to a release: this SDK uses ProtocolBuilder/add_protocol, the
      # error model and AuthUnavailableError, which first shipped in v0.6.0.
      - name: Check out vgi-rpc-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-cpp
          # TODO(release-wave): unreleased hosted-mode auth hooks (protocol-3.4 branch);
          # back to a release tag once vgi-rpc-cpp is released.
          ref: 35d1d453b3b0caa7cf7710d6ea54cc87e3cb8732
          path: vgi-rpc-c++

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout 2d32fae67c755b665794a0650f5d268979d7807f
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV

      - name: Install newer bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

      # vcpkg builds libsodium through its autotools script. The runners ship
      # libtool but not the complete autoconf toolset, and the port fails at
      # configure time when any one of these tools is absent.
      - name: Install autotools (libsodium)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install autoconf autoconf-archive automake libtool
          else
            sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool
          fi

      # vcpkg's binary cache covers the dependencies; this covers our own
      # translation units, which vcpkg knows nothing about.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 500M

      - name: Configure
        run: >
          cmake --preset default
          -DVGI_RPC_SOURCE_DIR=${{ github.workspace }}/vgi-rpc-c++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset default --parallel 2

      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure

      # The example worker is the deliverable: if it does not start, nothing
      # downstream of it can work. The unit step above already drove it for
      # real -- tests/protocol_routing_test.cpp calls vgi_rpc.Reflection.v1 and
      # a vgi.v3 method on it over stdio, a unix socket and HTTP.
      - name: Smoke — the worker describes itself
        run: |
          python3 -m pip install --quiet 'vgi-rpc[http]' || true
          test -x build/example-worker/vgi-example-worker
          echo "worker built: $(build/example-worker/vgi-example-worker --help 2>&1 | head -1 || true)"

      # vgi-rpc's hosted-protocols group: the worker hosts vgi.v3 and, through
      # Worker::set_hosted_protocols, conformance.Secondary.v1 -- on stdio,
      # a unix socket and HTTP -- and over HTTP opts into vgi_rpc.Identity.v2
      # with the conformance fixture policy.
      - name: Setup Python (reference requires 3.13)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Hosted protocols (vgi-rpc-test-hosted)
        if: runner.os == 'Linux'
        # The reference is cloned from main, unpinned -- the same pattern
        # vgi-rpc-cpp's CI uses: a reference change that breaks this SDK is
        # meant to turn it red the day it lands.
        run: |
          # TODO(release-wave): back to main (unpinned) once protocol-3.4 is merged.
          git clone --depth 1 --branch protocol-3.4 https://github.com/Query-farm/vgi-rpc-python.git ../vgi-rpc-ref
          python -m venv ../hosted-venv
          ../hosted-venv/bin/python -m pip install --quiet '../vgi-rpc-ref[http,conformance]' pytest pytest-timeout
          export PATH="$PWD/../hosted-venv/bin:$PATH"
          W="$PWD/build/example-worker/vgi-example-worker"
          vgi-rpc-test-hosted --cmd "$W" --expect vgi.v3,conformance.Secondary.v1
          SOCK=/tmp/vgi-hosted.sock
          "$W" --unix "$SOCK" & UNIX_PID=$!
          for _ in $(seq 50); do [ -S "$SOCK" ] && break; sleep 0.1; done
          vgi-rpc-test-hosted --unix "$SOCK" --expect vgi.v3,conformance.Secondary.v1
          kill "$UNIX_PID"
          "$W" --http --host 127.0.0.1 --port 0 --conformance-identity \
            --introspect-principals conformance-introspector > /tmp/vgi-hosted-http.log 2>&1 & HTTP_PID=$!
          PORT=""
          for _ in $(seq 100); do
            PORT=$(grep -m1 -o 'PORT:[0-9]*' /tmp/vgi-hosted-http.log | cut -d: -f2 || true)
            [ -n "$PORT" ] && break; sleep 0.1
          done
          vgi-rpc-test-hosted --url "http://127.0.0.1:$PORT" \
            --expect vgi.v3,conformance.Secondary.v1 --identity
          kill "$HTTP_PID"

  # Orchard hosted mode (VGI_ORCHARD_HOSTED=1): the extension repo's SDK-neutral
  # harness runs a fake Orchard issuer and checks every rule of the contract
  # over HTTP against the example worker, plus a refusal to start on every
  # transport that carries no Pass (stdio, --unix, the Iroh flags).
  hosted-mode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out vgi-rpc-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-cpp
          # TODO(release-wave): unreleased hosted-mode auth hooks (protocol-3.4 branch);
          # back to a release tag once vgi-rpc-cpp is released.
          ref: 35d1d453b3b0caa7cf7710d6ea54cc87e3cb8732
          path: vgi-rpc-c++

      - name: Check out the hosted-mode harness
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          # TODO(release-wave): vgi protocol-3.4; back to a v2.0 commit once it merges.
          ref: fce57984a7e8ea35f9dcd4a034b5ed37c85ca5c5
          path: vgi-upstream
          sparse-checkout: test/hosted

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout 2d32fae67c755b665794a0650f5d268979d7807f
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV

      - name: Install autotools (libsodium)
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: hosted-ubuntu-24.04
          max-size: 500M

      - name: Build example worker
        run: |
          cmake --preset release \
            -DVGI_RPC_SOURCE_DIR=${{ github.workspace }}/vgi-rpc-c++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-release --target vgi-example-worker --parallel 2

      - uses: astral-sh/setup-uv@v6

      - name: Hosted-mode conformance
        run: |
          W="$PWD/build-release/example-worker/vgi-example-worker"
          vgi-upstream/test/hosted/run_hosted_conformance.py \
            --worker-cmd "$W --http {port} --host 127.0.0.1" \
            --refuse-cmd "$W" \
            --refuse-cmd "$W --unix /tmp/vgi-hosted-refuse-{port}.sock" \
            --refuse-cmd "$W --iroh-raw-upstream {port} --iroh-issuer x" \
            --refuse-cmd "$W --http {port} --iroh-issuer x" \
            --streaming-body \
            --log-dir "$RUNNER_TEMP/hosted-logs"

      - name: Upload worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-mode-logs
          path: ${{ runner.temp }}/hosted-logs

  # The integration suite is the definition of done for this repo, and it needs
  # the DuckDB extension built from ~/Development/vgi — a large, separate build
  # that does not belong in this workflow. It runs locally via
  # scripts/run_tests.sh; see CLAUDE.md. Wiring it here needs the extension
  # published as a release artifact first, which is tracked separately.
