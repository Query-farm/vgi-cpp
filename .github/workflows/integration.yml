#
# Runs the canonical Query-farm/vgi integration sqllogictest suite against the
# C++ example worker across all three transports (subprocess / launcher / http),
# with the exact matching statically linked native runner. The harness also
# supports standalone runners using signed extensions for older protocol lanes.
name: Integration suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the v3 suite and statically linked native runner exactly.
  # TODO(release-wave): vgi protocol-3.4 (3.4.0 suite); back to a v2.0 commit
  # once 3.4 merges and its native runner artifacts are published.
  VGI_REF: e99683f2af215c5a166697945e796c91d0cc66fe
  VGI_NATIVE_RUNNER_BRANCH: protocol-3.4
  # Build every vcpkg port with the CMake (and ninja) that vcpkg pins for
  # this baseline, not whatever the runner image ships. The macOS image moved
  # to CMake 4.5.0, which rejects boost-locale 1.90 at configure time
  # (source_group: "include/boost/locale" is not a prefix of "locale.hpp").
  # Linux runners already used vcpkg's own CMake 4.2.3 because theirs was too
  # old; this makes that the rule on every runner.
  VCPKG_FORCE_DOWNLOADED_BINARIES: "1"
  VCPKG_BINARY_SOURCES: "${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_KEY_ID != '' && secrets.R2_ENDPOINT != '' && 'clear;x-aws,s3://query-farm-duckdb-vcpkg/,readwrite' || 'clear' }}"
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  integration:
    name: Linux / ${{ matrix.transport }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # vendor: the extension's blob-vendor lane (test/sql/external_storage/,
        # with protocol 3.4's argument references) over HTTP, ci/run-vendor-lane.sh.
        transport: [stdio, launch, http, vendor]
    steps:
      - uses: actions/checkout@v4

      - name: Check out vgi-rpc-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-cpp
          # TODO(release-wave): unreleased protocol 3.4 (StateRef, argument refs, blob vendor);
          # back to a release tag once vgi-rpc-cpp is released.
          ref: a710352420d6d699ce7ee9a1092308fb8aafd701
          path: vgi-rpc-c++

      - name: Check out the current vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout 2d32fae67c755b665794a0650f5d268979d7807f
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV

      - name: Install autotools (libsodium)
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: integration-ubuntu-24.04
          max-size: 500M

      - name: Build example worker
        run: |
          cmake --preset release \
            -DVGI_RPC_SOURCE_DIR=${{ github.workspace }}/vgi-rpc-c++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-release --target vgi-example-worker --parallel 2

      - name: Download native runner matching the test suite
        env:
          GH_TOKEN: ${{ github.token }}
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
        run: |
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py" \
            --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"

      - name: Setup Python (run_tests.py and the fake vendor)
        if: matrix.transport == 'vendor'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (the fake blob vendor runs under uvx)
        if: matrix.transport == 'vendor'
        uses: astral-sh/setup-uv@v6

      - name: Run the blob-vendor lane
        if: matrix.transport == 'vendor'
        run: ci/run-vendor-lane.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/build-release/example-worker/vgi-example-worker

      - name: Run integration suite (${{ matrix.transport }})
        if: matrix.transport != 'vendor'
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/build-release/example-worker/vgi-example-worker
          TRANSPORT: ${{ matrix.transport }}
